services:
  - type: web
    name: get-poc-backend
    runtime: node
    plan: free
    rootDir: backend
    # `--include=dev` est nécessaire malgré NODE_ENV=production ci-dessous :
    # npm saute les devDependencies par défaut quand NODE_ENV=production est
    # déjà présent au moment du build, or `nest build` vient de @nestjs/cli
    # qui est une devDependency (le runtime, lui, n'en a pas besoin).
    buildCommand: npm install --include=dev && npm run build
    # `prisma migrate deploy` est idempotent (n'applique que les migrations
    # en attente) — l'exécuter à chaque démarrage est sûr et évite de
    # dépendre d'une fonctionnalité "pre-deploy" qui n'existe pas forcément
    # sur le plan gratuit. Le service Render s'endort après 15 min
    # d'inactivité : ce redémarrage au réveil est donc fréquent, pas rare.
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      # ENABLE_SWAGGER / ALLOW_DEMO_SEED / ALLOW_MOCK_PAYMENT sont
      # volontairement en `sync: false` (à saisir manuellement dans le
      # dashboard Render) et non en dur : ce sont précisément les
      # garde-fous que seed.ts et payment.module.ts utilisent pour bloquer
      # comptes de démo et paiements simulés en production. Les figer ici
      # en "true" les rendrait actifs par défaut si ce fichier était un
      # jour dupliqué comme template pour un vrai déploiement production
      # (voir DEPLOYMENT.md). ALLOW_MOCK_PAYMENT n'a plus besoin d'être
      # activé pour ce QA depuis que STRIPE_SECRET_KEY (plus bas) est
      # configurée — le laisser à `sync: false` sans valeur suffit.
      - key: ENABLE_SWAGGER
        sync: false
      - key: ALLOW_DEMO_SEED
        sync: false
      - key: ALLOW_MOCK_PAYMENT
        sync: false
      # Secrets et URLs propres à l'environnement : à saisir dans le
      # dashboard Render (Blueprint ne les préremplit pas), voir DEPLOYMENT.md.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      # Fournisseur de paiement réel (Stripe, mode test) — voir
      # DEPLOYMENT.md. Dès que STRIPE_SECRET_KEY est définie,
      # PaymentModule utilise StripePaymentProvider au lieu du mock, quelle
      # que soit la valeur d'ALLOW_MOCK_PAYMENT ci-dessus.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Intégration n8n (voir docs/n8n/) — inutiles tant que ce QA n'est pas
      # utilisé pour tester les workflows n8n contre un backend déployé.
      # INTEGRATION_API_KEY : vérifie les appels n8n → ce backend.
      # N8N_WEBHOOK_BASE_URL / N8N_WEBHOOK_SECRET : appels sortants de ce
      # backend vers n8n (ex: student.created) — n'ont d'effet que si n8n
      # est réellement joignable depuis Render (tunnel ou hébergement dédié,
      # voir docs/n8n/02-preparation-infrastructure.md ; laisser
      # N8N_WEBHOOK_BASE_URL vide désactive silencieusement ces appels).
      - key: INTEGRATION_API_KEY
        sync: false
      - key: N8N_WEBHOOK_BASE_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_FORCE_PATH_STYLE
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
